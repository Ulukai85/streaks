name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: api/global.json
      - name: Restore
        run: dotnet restore
        working-directory: api
      - name: Build
        run: dotnet build --no-restore
        working-directory: api
      - name: Test
        run: dotnet test --no-build
        working-directory: api
      # Informational only - see docs/existing-problems.md for the existing npm audit
      # tracking posture. Does not fail the build; Dependabot alerts are the primary
      # ongoing mechanism (Stage 5 decision #13, docs/phase-4-plan.md).
      - name: List vulnerable packages (informational)
        run: dotnet list package --vulnerable --include-transitive
        working-directory: api
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Test
        run: npm run test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
