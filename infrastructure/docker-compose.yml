services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Sentry__Dsn: ${SENTRY_DSN}
      SEED_USER_NAME: ${SEED_USER_NAME}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      # Grafana Alloy runs on the host, not in Compose (ADR 0011) - api's own "localhost" is its
      # own network namespace on the default bridge network, so it must reach the host via
      # host.docker.internal instead (the extra_hosts entry below maps that to the host gateway).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
      OTEL_SERVICE_NAME: streaks-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dataprotection-keys:/keys
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /api/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    # Caddy now runs as a non-root user (web/Dockerfile) - binding :80 needs this capability
    # instead of root.
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  dataprotection-keys:
